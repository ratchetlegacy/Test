

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Je t'aime</title>
<style>
body {
margin: 0;
height: 100vh;
display: flex; /* pour centrer le contenu */
flex-direction: column;
align-items: center;
justify-content: center;
background: #1a0a12;
}

/* Le cœur = un carré tourné + deux ronds collés dessus */
.coeur {
position: relative;
width: 100px;
height: 100px;
background: #e3171c;
transform: rotate(-45deg);
animation: bat 1s infinite; /* l'animation tourne en boucle */
}
.coeur::before,
.coeur::after {
content: "";
position: absolute;
width: 100px;
height: 100px;
background: #e3171c;
border-radius: 50%; /* transforme le carré en rond */
}
.coeur::before { top: -50px; left: 0; }
.coeur::after { left: 50px; top: 0; }

/* Le battement : le cœur grossit puis revient */
@keyframes bat {
0%, 100% { transform: rotate(-45deg) scale(1); }
15% { transform: rotate(-45deg) scale(1.25); }
30% { transform: rotate(-45deg) scale(1); }
45% { transform: rotate(-45deg) scale(1.15); }
}

h1 {
margin-top: 90px;
color: #fff;
font-family: cursive;
font-size: 48px;
}
</style>
</head>
<body>
<div class="coeur"></div>
<h1 id="texte"></h1>

<script>
// Le texte s'écrit lettre par lettre
const message = "Je t'aime";
let i = 0;

function ecrire() {
if (i < message.length) {
document.getElementById("texte").textContent += message[i];
i++;
setTimeout(ecrire, 200); // une lettre toutes les 200 ms
}
}
ecrire();
</script>
</body>
</html>
